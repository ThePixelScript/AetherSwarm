[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ares-swarm"
version = "0.1.0"
description = "Resilient autonomous multi-UAV coordination for disaster-response missions"
requires-python = ">=3.12,<3.13"
dependencies = ["numpy>=1.26,<3", "PyYAML>=6,<7", "networkx>=3.4,<4"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
dev = ["pytest>=8,<10"]
simulation = ["scipy", "pandas", "matplotlib"]
ml = ["torch", "torch-geometric"]

[project.scripts]
ares-validate-config = "ares_swarm.core.config:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
