[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ares-swarm"
version = "0.1.0"
description = "Resilient autonomous multi-UAV coordination for disaster-response missions"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy",
    "networkx",
    "pyyaml",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

ml = [
    "torch",
    "torch-geometric",
]

[project.scripts]
ares-simulate = "ares_swarm.simulation.runner:main"

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
